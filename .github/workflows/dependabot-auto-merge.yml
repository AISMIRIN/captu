name: dependabot-auto-merge

# pull_request_target, not pull_request: workflow runs triggered by Dependabot
# read the Dependabot secret store instead of the Actions one, so the App
# credentials below resolve to empty strings under pull_request. This job never
# checks out the PR head, it only calls the GitHub API, so running it in the
# base-branch context carries no untrusted-code risk.
on: pull_request_target

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Use an App token instead of GITHUB_TOKEN: merges performed via
      # GITHUB_TOKEN do not trigger the push CI on main (recursive-workflow
      # protection), which skips the docker publish and hides a red main.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDABOT_SYNC_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_SYNC_APP_PRIVATE_KEY }}

      - name: Enable squash auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
